  else {let dx=e.clientX-old[0],dy=e.clientY-old[1],scale=dist*.002;target.x+=(-Math.cos(yaw)*dx+Math.sin(yaw)*dy)*scale;target.z+=(Math.sin(yaw)*dx+Math.cos(yaw)*dy)*scale}
  cameraUpdate();
 }
 pointers.set(e.pointerId,[e.clientX,e.clientY]);
},{passive:false});
canvas.addEventListener('pointerup',e=>{
 e.preventDefault();if(pointers.has(e.pointerId)&&pointers.size===1&&!moved&&!gestureWasMulti&&e.clientY<innerHeight-125){
 let p=groundAt(e.clientX,e.clientY);if(p){if(state.tab==='build'){if(Math.hypot(p.x,p.z)<46){if(place(state.mode,p.x,p.z))toast('Wybudowano: '+defs[state.mode][0]);else toast('Nie można tutaj budować')}else toast('Za daleko od królestwa')}else if(state.tab==='orders'){moveTarget={x:p.x,z:p.z};order='move';toast('Wyznaczono punkt marszu')}}}
 pointers.delete(e.pointerId);lastDist=0;if(pointers.size===0){start=null;moved=false}
},{passive:false});
canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastDist=0;start=null;moved=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(18,Math.min(100,dist*(1+Math.sign(e.deltaY)*.08)));cameraUpdate()},{passive:false});
let last=performance.now(),uiT=0,enemyT=0;function walk(u,tx,tz,dt,speed){let dx=tx-u.x,dz=tz-u.z,len=Math.hypot(dx,dz);if(len>.55){u.x+=dx/len*Math.min(len,dt*speed);u.z+=dz/len*Math.min(len,dt*speed);u.obj.position.set(u.x,0,u.z);u.obj.rotation.y=Math.atan2(dx,dz);u.obj.position.y=Math.sin(state.time*8+u.x)*.045;return len}return len}
function remove(u,arr){scene.remove(u.obj);let i=arr.indexOf(u);if(i>=0)arr.splice(i,1)}function battle(dt){for(let u of [...state.units]){let foe=state.enemies.reduce((a,b)=>!a||Math.hypot(b.x-u.x,b.z-u.z)<Math.hypot(a.x-u.x,a.z-u.z)?b:a,null);let d=foe?Math.hypot(foe.x-u.x,foe.z-u.z):Infinity;if(d<(u.archer?9:2.2)){foe.hp-=u.atk*dt*.75;if(foe.hp<=0){remove(foe,state.enemies);state.gold+=4}}else if(order==='attack')walk(u,foe?foe.x:29,foe?foe.z:-22,dt,3.1);else if(order==='move'&&moveTarget)walk(u,moveTarget.x,moveTarget.z,dt,3.2);else if(foe&&d<12)walk(u,foe.x,foe.z,dt,2.9);else if(order==='defend')walk(u,-8+(state.units.indexOf(u)%4)*1.4,7+Math.floor(state.units.indexOf(u)/4)*1.5,dt,2.6)}for(let e of [...state.enemies]){let ally=state.units.reduce((a,b)=>!a||Math.hypot(b.x-e.x,b.z-e.z)<Math.hypot(a.x-e.x,a.z-e.z)?b:a,null);let d=ally?Math.hypot(ally.x-e.x,ally.z-e.z):Infinity;if(d<2.2){ally.hp-=e.atk*dt;if(ally.hp<=0)remove(ally,state.units)}else if(Math.hypot(e.x+8,e.z-7)<5){state.castleHP-=e.atk*dt*.5;if(state.castleHP<=0){state.over=true;toast('💀 Twoje królestwo upadło!')}}else walk(e,ally&&d<7?ally.x:-8,ally&&d<7?ally.z:7,dt,1.35)}if(order==='attack'&&state.units.some(u=>Math.hypot(u.x-29,u.z+22)<6)){state.enemyHP-=dt*state.units.length*8;if(state.enemyHP<=0){state.enemyHP=900;state.gold+=100;toast('🏆 Zdobyłeś wrogi zamek! +100 złota')}}}
function tick(now){let dt=Math.min(.07,(now-last)/1000);last=now;state.time+=dt;if(!state.over){let l=state.buildings.filter(b=>!b.enemy&&b.type==='lumber').length,q=state.buildings.filter(b=>!b.enemy&&b.type==='quarry').length,f=state.buildings.filter(b=>!b.enemy&&b.type==='farm').length,h=state.buildings.filter(b=>!b.enemy&&b.type==='house').length;state.wood+=l*dt*.32;state.stone+=q*dt*.24;state.food+=f*dt*.33;state.gold+=dt*(.12+h*.04);battle(dt);enemyT+=dt;if(enemyT>65){enemyT=0;spawnEnemy()}}uiT+=dt;if(uiT>.22){showUI();uiT=0}renderer.render(scene,camera);requestAnimationFrame(tick)}menu();showUI();document.getElementById('load').remove();toast('Witaj w Królestwach Pustyni 3D!');requestAnimationFrame(tick);
})();
