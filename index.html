<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#151d1a"><title>Królestwa Pustyni</title><style>*{box-sizing:border-box}body{margin:0;background:#111a18;color:#f4e7c8;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100dvh;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#15211eea;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}#title{font-weight:800;color:#e8c982}#stats{font-size:12px;text-align:right;line-height:1.6}#bar{position:fixed;bottom:0;left:0;right:0;background:#14201df2;padding:9px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:7px;overflow-x:auto}button{flex:0 0 auto;background:#35463c;color:#fff0cf;border:1px solid #9c8a5c;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px}button.selected{background:#aa7a34;color:#14140d}#hint{position:fixed;top:calc(65px + env(safe-area-inset-top));left:10px;right:10px;text-align:center;color:#fff1d0;text-shadow:0 2px 3px #000;font-size:12px;pointer-events:none}#toast{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#101a17e8;border:1px solid #bda56b;border-radius:8px;padding:8px 14px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}#reset{position:fixed;top:calc(82px + env(safe-area-inset-top));right:10px;font-size:11px;padding:7px;opacity:.8}</style></head><body><canvas id="game"></canvas><div id="top"><div id="title">🏰 KRÓLESTWA PUSTYNI <small>0.1</small></div><div id="stats"></div></div><div id="hint">Dotknij pola, aby budować • Przeciągnij mapę • Rozsuń palce, aby przybliżyć</div><button id="reset">Nowa gra</button><div id="toast"></div><div id="bar"></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stats=document.querySelector('#stats'),bar=document.querySelector('#bar'),toast=document.querySelector('#toast');const N=24,tw=64,th=32,types={keep:{label:'🏰 Zamek',cost:{},color:'#a6a49b'},house:{label:'🏠 Dom',cost:{wood:15},color:'#b97949'},lumber:{label:'🪓 Drwal',cost:{wood:10},color:'#7d5336'},quarry:{label:'⛏️ Kamieniołom',cost:{wood:20},color:'#8a9293'},farm:{label:'🌾 Farma',cost:{wood:12},color:'#bca454'},wall:{label:'🧱 Mur',cost:{stone:8},color:'#aaa9a1'}};let resources={wood:90,stone:50,food:50,gold:100},buildings=[],selected='house',cam={x:innerWidth/2,y:120,zoom:1},touches=new Map(),lastPinch=0,lastTick=Date.now(),lastSave=0,dragged=false,startPoint=null;const trees=[],rocks=[];let seed=19245;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let x=0;x<N;x++)for(let y=0;y<N;y++){if(rand()<.14)trees.push({x,y});else if(rand()<.045)rocks.push({x,y})}function load(){try{const a=JSON.parse(localStorage.getItem('krolestwa_v01'));if(a){resources=a.resources;buildings=a.buildings;return}}catch(e){}buildings=[{x:11,y:11,type:'keep'}]}load();function save(){try{localStorage.setItem('krolestwa_v01',JSON.stringify({resources,buildings}))}catch(e){}}function notify(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.style.opacity=0,1700)}function refresh(){stats.textContent=`🪵 ${Math.floor(resources.wood)}   🪨 ${Math.floor(resources.stone)}   🌾 ${Math.floor(resources.food)}   🪙 ${Math.floor(resources.gold)}`;for(const b of bar.children)b.classList.toggle('selected',b.dataset.type===selected)}for(const [key,t] of Object.entries(types)){if(key==='keep')continue;const b=document.createElement('button');b.dataset.type=key;b.textContent=t.label+' '+Object.entries(t.cost).map(([r,v])=>(r==='wood'?'🪵':'🪨')+v).join(' ');b.onclick=()=>{selected=key;refresh()};bar.appendChild(b)}function iso(x,y){return {x:cam.x+(x-y)*tw*.5*cam.zoom,y:cam.y+(x+y)*th*.5*cam.zoom}}function inverse(x,y){const a=(x-cam.x)/(tw*.5*cam.zoom),b=(y-cam.y)/(th*.5*cam.zoom);return {x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function diamond(x,y,color){const p=iso(x+.5,y+.5),w=tw*cam.zoom/2,h=th*cam.zoom/2;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}],color,'#4b583b55')}function structure(b){const p=iso(b.x+.5,b.y+.5),z=cam.zoom,w=24*z,h=24*z;let color=types[b.type].color;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+7*z,20*z,8*z,0,0,Math.PI*2);ctx.fill();if(b.type==='farm'){ctx.fillStyle='#a4a43d';ctx.fillRect(p.x-20*z,p.y-7*z,40*z,16*z);ctx.strokeStyle='#ead16a';for(let i=-15;i<=15;i+=7){ctx.beginPath();ctx.moveTo(p.x+i*z,p.y-7*z);ctx.lineTo(p.x+i*z,p.y+9*z);ctx.stroke()}return}ctx.fillStyle=color;ctx.fillRect(p.x-w/2,p.y-h,w,h);ctx.fillStyle=b.type==='wall'?'#c9c7ba':'#5a392a';poly([{x:p.x-w*.65,y:p.y-h},{x:p.x,y:p.y-h-13*z},{x:p.x+w*.65,y:p.y-h},{x:p.x,y:p.y-h+7*z}],ctx.fillStyle);if(b.type==='keep'){ctx.fillStyle='#d5cdb4';ctx.fillRect(p.x-18*z,p.y-h-18*z,10*z,28*z);ctx.fillRect(p.x+8*z,p.y-h-18*z,10*z,28*z);ctx.fillStyle='#c44f36';ctx.fillRect(p.x+3*z,p.y-h-38*z,2*z,20*z);poly([{x:p.x+5*z,y:p.y-h-38*z},{x:p.x+19*z,y:p.y-h-33*z},{x:p.x+5*z,y:p.y-h-28*z}],'#c44f36')}if(b.type==='house'){ctx.fillStyle='#463324';ctx.fillRect(p.x-4*z,p.y-10*z,8*z,10*z)}}function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function render(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#667447';ctx.fillRect(0,0,innerWidth,innerHeight);for(let s=0;s<2*N;s++)for(let x=0;x<N;x++){const y=s-x;if(y<0||y>=N)continue;const p=iso(x+.5,y+.5);if(p.x < -90||p.x>innerWidth+90||p.y < -90||p.y>innerHeight+90)continue;diamond(x,y,(x+y)%3===0?'#a4a16b':'#a9a876')}const items=[...trees.map(v=>({...v,kind:'tree'})),...rocks.map(v=>({...v,kind:'rock'})),...buildings.map(v=>({...v,kind:'building'}))].sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const o of items){const p=iso(o.x+.5,o.y+.5),z=cam.zoom;if(o.kind==='building'){structure(o);continue}if(buildings.some(b=>b.x===o.x&&b.y===o.y))continue;if(o.kind==='tree'){ctx.fillStyle='#5e3f26';ctx.fillRect(p.x-3*z,p.y-18*z,6*z,20*z);ctx.fillStyle='#375e36';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(p.x+(i-1)*6*z,p.y-(20+i%2*8)*z,11*z,0,Math.PI*2);ctx.fill()}}else{poly([{x:p.x-14*z,y:p.y},{x:p.x-7*z,y:p.y-15*z},{x:p.x+6*z,y:p.y-18*z},{x:p.x+15*z,y:p.y},{x:p.x,y:p.y+4*z}],'#86887e')}}requestAnimationFrame(render)}render();function buildAt(screenX,screenY){const g=inverse(screenX,screenY);if(g.x<0||g.y<0||g.x>=N||g.y>=N)return notify('Poza mapą');if(buildings.some(b=>b.x===g.x&&b.y===g.y))return notify('To pole jest zajęte');const cost=types[selected].cost;if(Object.entries(cost).some(([r,n])=>resources[r]<n))return notify('Brakuje surowców!');for(const [r,n]of Object.entries(cost))resources[r]-=n;buildings.push({x:g.x,y:g.y,type:selected});save();refresh();notify('Wybudowano: '+types[selected].label)}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){startPoint={x:e.clientX,y:e.clientY};dragged=false}});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const old=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){const dx=e.clientX-old.x,dy=e.clientY-old.y;if(Math.hypot(e.clientX-startPoint.x,e.clientY-startPoint.y)>8)dragged=true;if(dragged){cam.x+=dx;cam.y+=dy}}else if(touches.size===2){dragged=true;const v=[...touches.values()],dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(lastPinch)cam.zoom=Math.max(.5,Math.min(2.2,cam.zoom*dist/lastPinch));lastPinch=dist}});function end(e){if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);if(!dragged&&touches.size===0)buildAt(e.clientX,e.clientY);if(touches.size<2)lastPinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);lastPinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.5,Math.min(2.2,cam.zoom*(e.deltaY>0?.92:1.08)))},{passive:false});document.querySelector('#reset').onclick=()=>{if(confirm('Rozpocząć nową grę?')){resources={wood:90,stone:50,food:50,gold:100};buildings=[{x:11,y:11,type:'keep'}];save();refresh();notify('Nowe królestwo!')}};setInterval(()=>{const n={lumber:0,quarry:0,farm:0,house:0};for(const b of buildings)if(n[b.type]!==undefined)n[b.type]++;resources.wood+=n.lumber*2;resources.stone+=n.quarry*1.5;resources.food+=n.farm*2;resources.gold+=n.house*.5;resources.food=Math.max(0,resources.food-n.house*.2);refresh();save()},3000);refresh();})();
</script></body></html>
