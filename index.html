<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#151d1a"><title>Królestwa Pustyni</title><style>*{box-sizing:border-box}body{margin:0;background:#111a18;color:#f4e7c8;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100dvh;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#15211eea;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}#title{font-weight:800;color:#e8c982}#stats{font-size:12px;text-align:right;line-height:1.6}#bar{position:fixed;bottom:0;left:0;right:0;background:#14201df2;padding:9px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:7px;overflow-x:auto}button{flex:0 0 auto;background:#35463c;color:#fff0cf;border:1px solid #9c8a5c;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px}button.selected{background:#aa7a34;color:#14140d}#hint{position:fixed;top:calc(65px + env(safe-area-inset-top));left:10px;right:10px;text-align:center;color:#fff1d0;text-shadow:0 2px 3px #000;font-size:12px;pointer-events:none}#toast{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#101a17e8;border:1px solid #bda56b;border-radius:8px;padding:8px 14px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}#reset{position:fixed;top:calc(82px + env(safe-area-inset-top));right:10px;font-size:11px;padding:7px;opacity:.8}#bar{bottom:0}#actions{position:fixed;bottom:calc(77px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;pointer-events:auto}#actions button{background:#283c36;border-color:#8f986b}#actions button.selected{background:#b58a42;color:#151b12}#info{position:fixed;top:calc(114px + env(safe-area-inset-top));left:10px;background:#182820e6;border:1px solid #b39a60;border-radius:8px;padding:7px 9px;font-size:12px;max-width:75vw;pointer-events:none}#reset{top:calc(77px + env(safe-area-inset-top))}#toast{bottom:calc(145px + env(safe-area-inset-bottom));max-width:90vw;white-space:normal;text-align:center}</style></head><body><canvas id="game"></canvas><div id="top"><div id="title">🏰 KRÓLESTWA PUSTYNI <small>0.3</small></div><div id="stats"></div></div><div id="hint">Wybierz budynek lub rozkaz • Przesuń mapę palcem • Uszczypnij, by przybliżyć</div><button id="reset">Nowa gra</button><div id="info"></div><div id="toast"></div><div id="actions"></div><div id="bar"></div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stats=document.getElementById('stats'),bar=document.getElementById('bar'),actions=document.getElementById('actions'),info=document.getElementById('info'),toast=document.getElementById('toast');
const N=30,tw=64,th=32,KEY='krolestwa_v03';

let resources={wood:130,stone:80,food:90,gold:130},buildings=[],units=[],enemyUnits=[],enemy={x:24,y:24,hp:380,max:380},selected='house',mode='build',chosen=[],cam={x:innerWidth/2,y:-150,zoom:.85},touches=new Map(),lastPinch=0,dragged=false,startPoint=null,gameTime=0,wave=0,won=false,lost=false,uid=1,last=performance.now(),tickAccum=0,saveAccum=0;
let villagers=[],dust=[],decorTime=0;let seed=19245;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const trees=[],rocks=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++){if(rand()<.13)trees.push({x,y});else if(rand()<.04)rocks.push({x,y})}
function fresh(){villagers=[];dust=[];resources={wood:130,stone:80,food:90,gold:130};buildings=[{x:7,y:7,type:'keep',hp:500}];units=[];enemyUnits=[];enemy={x:24,y:24,hp:380,max:380};uid=1;gameTime=0;wave=0;won=false;lost=false;chosen=[];mode='build';selected='house'}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.buildings)){resources=s.resources;buildings=s.buildings;units=s.units||[];enemyUnits=s.enemyUnits||[];enemy=s.enemy||enemy;gameTime=s.gameTime||0;wave=s.wave||0;uid=s.uid||100;won=!!s.won;lost=!!s.lost;villagers=s.villagers||[];return}}catch(e){}try{let s=JSON.parse(localStorage.getItem('krolestwa_v02'));if(s&&Array.isArray(s.buildings)){fresh();resources={...resources,...s.resources};buildings=s.buildings;units=s.units||[];enemyUnits=s.enemyUnits||[];enemy=s.enemy||enemy;gameTime=s.gameTime||0;wave=s.wave||0;uid=s.uid||100;won=!!s.won;lost=!!s.lost;notify('Przeniesiono królestwo z 0.2!');return}}catch(e){}try{let s=JSON.parse(localStorage.getItem('krolestwa_v01'));if(s&&Array.isArray(s.buildings)){fresh();resources={...resources,...s.resources};buildings=s.buildings.map(b=>({...b,hp:types[b.type]?.hp||90}));notify('Przeniesiono osadę z wersji 0.1!');return}}catch(e){}fresh()}

function notify(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(notify.t);notify.t=setTimeout(()=>toast.style.opacity=0,2200)}
function button(label,action,parent=actions){let b=document.createElement('button');b.textContent=label;b.onclick=action;parent.appendChild(b);return b}
for(let [k,t] of Object.entries(types)){if(k==='keep')continue;let b=button(t.label+' '+Object.entries(t.cost).map(([r,v])=>(r==='wood'?'🪵':'🪨')+v).join(' '),()=>{mode='build';selected=k;refresh()},bar);b.dataset.type=k}
let moveBtn=button('👆 Wybierz / ruch',()=>{mode='command';refresh()}),swordBtn=button('🗡️ Włócznik 20🪙 8🌾',()=>recruit('spear')),archerBtn=button('🏹 Łucznik 30🪙 10🌾',()=>recruit('archer')),allBtn=button('⚔️ Cała armia',()=>{chosen=units.map(u=>u.id);mode='command';notify('Zaznaczono całą armię. Dotknij celu.');refresh()}),pauseBtn=button('⏸️ Pauza',()=>{paused=!paused;pauseBtn.textContent=paused?'▶️ Graj':'⏸️ Pauza'});let paused=false;let speed=1;button('⏩ x1 / x2',()=>{speed=speed===1?2:1;speedBtn.textContent='⏩ x'+speed},actions);let speedBtn=actions.lastChild;
function refresh(){stats.textContent=`🪵${Math.floor(resources.wood)} 🪨${Math.floor(resources.stone)} 🌾${Math.floor(resources.food)} 🪙${Math.floor(resources.gold)}`;for(let b of bar.children)b.classList.toggle('selected',mode==='build'&&b.dataset.type===selected);moveBtn.classList.toggle('selected',mode==='command');info.textContent=`👥 ${units.length} wojska • 🏴 Wróg ${Math.ceil(Math.max(0,enemy.hp))} HP • 👷 ${villagers.length} robotników • 🌊 Fala ${wave} • ${won?'🏆 ZWYCIĘSTWO':lost?'💀 PORAŻKA':mode==='build'?'Budowa: '+types[selected].label:chosen.length?'Rozkaz dla '+chosen.length+' jednostek':'Dotknij żołnierza, by zaznaczyć'}`}
function spend(cost){if(Object.entries(cost).some(([r,n])=>resources[r]<n)){notify('Za mało surowców!');return false}for(let [r,n] of Object.entries(cost))resources[r]-=n;return true}
function recruit(kind){if(lost||won)return notify('Rozpocznij nową grę');let b=buildings.find(b=>b.type==='barracks');if(!b)return notify('Najpierw zbuduj koszary!');if(!spend(kind==='spear'?{gold:20,food:8}:{gold:30,food:10}))return;units.push({id:uid++,kind,x:b.x+.5,y:b.y+.5,hp:kind==='spear'?80:55,max:kind==='spear'?80:55,tx:b.x+1.5,ty:b.y+.5,cool:0});save();refresh();notify('Zrekrutowano '+(kind==='spear'?'włócznika':'łucznika'))}
function iso(x,y){return{x:cam.x+(x-y)*tw*.5*cam.zoom,y:cam.y+(x+y)*th*.5*cam.zoom}}function inverse(x,y){let a=(x-cam.x)/(tw*.5*cam.zoom),b=(y-cam.y)/(th*.5*cam.zoom);return{x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function poly(p,fill,stroke){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function diamond(x,y,color){let p=iso(x+.5,y+.5),w=tw*cam.zoom/2,h=th*cam.zoom/2;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}],color,'#5b583c44')}
function structure(b){let p=iso(b.x+.5,b.y+.5),z=cam.zoom,w=25*z,h=24*z;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y+6*z,20*z,8*z,0,0,Math.PI*2);ctx.fill();if(b.type==='farm'){ctx.fillStyle='#9c963c';ctx.fillRect(p.x-20*z,p.y-7*z,40*z,16*z);ctx.strokeStyle='#e4d074';for(let i=-15;i<=15;i+=7){ctx.beginPath();ctx.moveTo(p.x+i*z,p.y-7*z);ctx.lineTo(p.x+i*z,p.y+9*z);ctx.stroke()}return}ctx.fillStyle=types[b.type]?.color||'#999';ctx.fillRect(p.x-w/2,p.y-h,w,h);poly([{x:p.x-w*.7,y:p.y-h},{x:p.x,y:p.y-h-14*z},{x:p.x+w*.7,y:p.y-h},{x:p.x,y:p.y-h+6*z}],b.type==='wall'?'#cac8b8':'#674332');if(b.type==='keep'||b.type==='tower'){ctx.fillStyle='#d1c9b2';ctx.fillRect(p.x-18*z,p.y-h-17*z,10*z,28*z);ctx.fillRect(p.x+8*z,p.y-h-17*z,10*z,28*z);ctx.fillStyle=b.type==='keep'?'#c44f36':'#dfba65';ctx.fillRect(p.x+3*z,p.y-h-36*z,2*z,19*z);poly([{x:p.x+5*z,y:p.y-h-36*z},{x:p.x+20*z,y:p.y-h-30*z},{x:p.x+5*z,y:p.y-h-25*z}],ctx.fillStyle)}if(b.type==='barracks'){ctx.fillStyle='#dbbd78';ctx.fillRect(p.x-3*z,p.y-19*z,6*z,19*z)}if(b.type==='house'){ctx.fillStyle='#463324';ctx.fillRect(p.x-4*z,p.y-10*z,8*z,10*z)}if(b.hp<types[b.type].hp){ctx.fillStyle='#521d16';ctx.fillRect(p.x-15*z,p.y-h-23*z,30*z,3*z);ctx.fillStyle='#9bd16c';ctx.fillRect(p.x-15*z,p.y-h-23*z,30*z*Math.max(0,b.hp/types[b.type].hp),3*z)}}
function unitDraw(u,enemySide){let p=iso(u.x,u.y),z=cam.zoom,sel=chosen.includes(u.id)&&!enemySide;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(p.x,p.y,7*z,3*z,0,0,Math.PI*2);ctx.fill();if(sel){ctx.strokeStyle='#ffec75';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,12*z,6*z,0,0,Math.PI*2);ctx.stroke()}ctx.fillStyle=enemySide?'#a83630':u.kind==='archer'?'#e6c86b':'#4c86a2';ctx.fillRect(p.x-4*z,p.y-14*z,8*z,12*z);ctx.fillStyle='#e7c9a3';ctx.beginPath();ctx.arc(p.x,p.y-17*z,4*z,0,Math.PI*2);ctx.fill();ctx.strokeStyle=enemySide?'#e6a19a':'#e0d5a5';ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(p.x+5*z,p.y-14*z);ctx.lineTo(p.x+10*z,p.y-26*z);ctx.stroke();ctx.fillStyle='#411b16';ctx.fillRect(p.x-8*z,p.y-30*z,16*z,2*z);ctx.fillStyle='#75d76e';ctx.fillRect(p.x-8*z,p.y-30*z,16*z*Math.max(0,u.hp/u.max),2*z)}
function drawVillager(v){let p=iso(v.x,v.y),z=cam.zoom;ctx.fillStyle='#34271999';ctx.beginPath();ctx.ellipse(p.x,p.y,5*z,2*z,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=v.job==='farm'?'#c8a74a':v.job==='quarry'?'#8495a2':'#866443';ctx.fillRect(p.x-3*z,p.y-11*z,6*z,9*z);ctx.fillStyle='#e9c99c';ctx.beginPath();ctx.arc(p.x,p.y-13*z,3*z,0,7);ctx.fill();ctx.fillStyle='#e6cf88';ctx.fillRect(p.x-3*z,p.y-18*z,6*z,3*z);if(v.carry){ctx.fillStyle=v.job==='quarry'?'#a7a9a1':v.job==='farm'?'#e0c45b':'#8b5a31';ctx.fillRect(p.x+4*z,p.y-9*z,5*z,5*z)}}
function render(){let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#626c46';ctx.fillRect(0,0,w,h);for(let s=0;s<2*N;s++)for(let x=0;x<N;x++){let y=s-x;if(y<0||y>=N)continue;let p=iso(x+.5,y+.5);if(p.x<-95||p.x>w+95||p.y<-95||p.y>h+95)continue;diamond(x,y,(x+y)%3===0?'#a59d69':'#aaa575')}
let objects=[...trees.map(t=>({...t,kind:'tree'})),...rocks.map(t=>({...t,kind:'rock'})),...buildings.map(t=>({...t,kind:'building'})),...units.map(t=>({...t,kind:'unit'})),...enemyUnits.map(t=>({...t,kind:'foe'})),...villagers.map(t=>({...t,kind:'villager'})),{...enemy,kind:'enemykeep'}].sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(let o of objects){let p=iso(o.x+.5,o.y+.5),z=cam.zoom;if(o.kind==='building'){structure(o);continue}if(o.kind==='enemykeep'){if(enemy.hp>0){structure({...enemy,type:'keep',hp:enemy.hp});ctx.fillStyle='#a22c2c';ctx.fillRect(p.x-18*z,p.y-72*z,36*z,5*z);ctx.fillStyle='#d9c65d';ctx.fillRect(p.x-18*z,p.y-72*z,36*z*enemy.hp/enemy.max,5*z)}continue}if(o.kind==='villager'){drawVillager(o);continue}if(o.kind==='unit'||o.kind==='foe'){unitDraw(o,o.kind==='foe');continue}if(buildings.some(b=>b.x===o.x&&b.y===o.y)||Math.floor(enemy.x)===o.x&&Math.floor(enemy.y)===o.y)continue;if(o.kind==='tree'){ctx.fillStyle='#5e3f26';ctx.fillRect(p.x-3*z,p.y-18*z,6*z,20*z);ctx.fillStyle='#385c36';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(p.x+(i-1)*6*z,p.y-(20+i%2*8)*z,11*z,0,Math.PI*2);ctx.fill()}}else poly([{x:p.x-14*z,y:p.y},{x:p.x-7*z,y:p.y-15*z},{x:p.x+6*z,y:p.y-18*z},{x:p.x+15*z,y:p.y},{x:p.x,y:p.y+4*z}],'#86887e')}
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function stepTo(u,target,speed,dt){let d=dist(u,target);if(d<.07)return;let t=Math.min(1,speed*dt/d);u.x+=(target.x-u.x)*t;u.y+=(target.y-u.y)*t}
function update(dt){if(paused||won||lost)return;dt*=speed;gameTime+=dt;decorTime+=dt;
if(decorTime>2){decorTime=0;let workplaces=buildings.filter(b=>['lumber','quarry','farm'].includes(b.type));let capacity=Math.min(workplaces.length,Math.max(1,buildings.filter(b=>b.type==='house').length*3));while(villagers.length>capacity)villagers.pop();while(villagers.length<capacity){let home=buildings.find(b=>b.type==='keep')||{x:7,y:7};villagers.push({x:home.x+.5,y:home.y+.5,job:'lumber',target:0,carry:false})}villagers.forEach((v,i)=>{let w=workplaces[i%Math.max(1,workplaces.length)];if(w){v.job=w.type;v.workX=w.x+.5;v.workY=w.y+.5}})}
for(let v of villagers){let keep=buildings.find(b=>b.type==='keep')||{x:7,y:7};let dest=v.carry?{x:keep.x+.5,y:keep.y+.5}:{x:v.workX??keep.x+.5,y:v.workY??keep.y+.5};stepTo(v,dest,.75,dt);if(dist(v,dest)<.18)v.carry=!v.carry}
tickAccum+=dt;saveAccum+=dt;if(tickAccum>=3){let n={lumber:0,quarry:0,farm:0,house:0};for(let b of buildings)if(n[b.type]!==undefined)n[b.type]++;let workers=Math.max(1,n.house*3);let jobs=n.lumber+n.quarry+n.farm;let efficiency=jobs?Math.min(1,workers/jobs):1;resources.wood+=n.lumber*2*efficiency;resources.stone+=n.quarry*1.5*efficiency;resources.food+=n.farm*2*efficiency;resources.gold+=n.house*.65;resources.food=Math.max(0,resources.food-n.house*.25);tickAccum=0;refresh()}
if(gameTime>wave*48+35){wave++;for(let i=0;i<Math.min(2+wave,9);i++)enemyUnits.push({id:uid++,kind:'spear',x:enemy.x+(Math.random()-.5)*2,y:enemy.y+(Math.random()-.5)*2,hp:48,max:48,cool:0});notify('⚠️ Nadciąga fala wrogów nr '+wave+'!');refresh()}
for(let u of units){u.cool=Math.max(0,(u.cool||0)-dt);let targets=[...enemyUnits];if(enemy.hp>0)targets.push(enemy);let nearest=targets.sort((a,b)=>dist(u,a)-dist(u,b))[0];let range=u.kind==='archer'?3.3:1.05;if(nearest&&dist(u,nearest)<range){if(u.cool<=0){nearest.hp-=u.kind==='archer'?11:17;u.cool=u.kind==='archer'?1.15:.85}}else if(u.tx!==undefined)stepTo(u,{x:u.tx,y:u.ty},u.kind==='archer'?1.7:2,dt)}
for(let u of enemyUnits){u.cool=Math.max(0,(u.cool||0)-dt);let targets=[...units,...buildings.map(b=>({...b,x:b.x+.5,y:b.y+.5,building:b}))];let nearest=targets.sort((a,b)=>dist(u,a)-dist(u,b))[0];if(!nearest)continue;if(dist(u,nearest)<1.1){if(u.cool<=0){if(nearest.building)nearest.building.hp-=9;else nearest.hp-=9;u.cool=1.1}}else stepTo(u,nearest,1.05,dt)}
units=units.filter(u=>u.hp>0);enemyUnits=enemyUnits.filter(u=>u.hp>0);buildings=buildings.filter(b=>b.hp>0);chosen=chosen.filter(id=>units.some(u=>u.id===id));if(!buildings.some(b=>b.type==='keep')){lost=true;notify('💀 Zamek upadł! Zacznij nową grę.')}if(enemy.hp<=0){won=true;notify('🏆 ZWYCIĘSTWO! Zdobyłeś twierdzę wroga!')}if(saveAccum>8){saveAccum=0;save()}refresh()}
function buildAt(sx,sy){let g=inverse(sx,sy);if(g.x<0||g.y<0||g.x>=N||g.y>=N)return notify('Poza mapą');if(mode==='command'){let nearest=units.map(u=>({u,d:Math.hypot(u.x-g.x-.5,u.y-g.y-.5)})).sort((a,b)=>a.d-b.d)[0];if(nearest&&nearest.d<1.2){chosen=[nearest.u.id];refresh();return notify('Wybrano jednostkę. Dotknij miejsca lub wroga.')}if(!chosen.length)return notify('Wybierz żołnierza albo przycisk Cała armia');for(let id of chosen){let u=units.find(u=>u.id===id);if(u){u.tx=g.x+.5+(Math.random()-.5)*.5;u.ty=g.y+.5+(Math.random()-.5)*.5}}notify('⚔️ Wydano rozkaz ruchu / ataku');save();return}
if(lost||won)return notify('Rozpocznij nową grę');if(buildings.some(b=>b.x===g.x&&b.y===g.y)||g.x===enemy.x&&g.y===enemy.y)return notify('To pole jest zajęte');if(!spend(types[selected].cost))return;buildings.push({x:g.x,y:g.y,type:selected,hp:types[selected].hp});save();refresh();notify('Wybudowano: '+types[selected].label)}
function resize(){let dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){startPoint={x:e.clientX,y:e.clientY};dragged=false}else dragged=true});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let old=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){let dx=e.clientX-old.x,dy=e.clientY-old.y;if(startPoint&&Math.hypot(e.clientX-startPoint.x,e.clientY-startPoint.y)>8)dragged=true;if(dragged){cam.x+=dx;cam.y+=dy}}else if(touches.size===2){dragged=true;let v=[...touches.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(lastPinch)cam.zoom=Math.max(.45,Math.min(2.2,cam.zoom*d/lastPinch));lastPinch=d}});function end(e){if(!touches.has(e.pointerId))return;touches.delete(e.pointerId);if(!dragged&&touches.size===0)buildAt(e.clientX,e.clientY);if(touches.size<2)lastPinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);lastPinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.45,Math.min(2.2,cam.zoom*(e.deltaY>0?.92:1.08)))},{passive:false});
document.getElementById('reset').onclick=()=>{if(confirm('Rozpocząć nową grę? Poprzedni zapis 0.2 zostanie zastąpiony.')){fresh();save();refresh();notify('Nowe królestwo!')}};
load();refresh();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
