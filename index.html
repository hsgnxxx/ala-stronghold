<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#151d1a"><title>Królestwa Pustyni</title><style>*{box-sizing:border-box}body{margin:0;background:#111a18;color:#f4e7c8;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}#game{display:block;width:100vw;height:100dvh;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:linear-gradient(90deg,#17251ff2,#334132ec);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}#title{font-weight:800;color:#e8c982}#stats{font-size:12px;text-align:right;line-height:1.6}#bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#2a3429f2,#101c18f9);padding:9px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:7px;overflow-x:auto}button{flex:0 0 auto;background:#35463c;color:#fff0cf;border:1px solid #9c8a5c;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px}button.selected{background:#aa7a34;color:#14140d}#hint{position:fixed;top:calc(65px + env(safe-area-inset-top));left:10px;right:10px;text-align:center;color:#fff1d0;text-shadow:0 2px 3px #000;font-size:12px;pointer-events:none}#toast{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#101a17e8;border:1px solid #bda56b;border-radius:8px;padding:8px 14px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}#reset{position:fixed;top:calc(82px + env(safe-area-inset-top));right:10px;font-size:11px;padding:7px;opacity:.8}#bar{bottom:0}#actions{position:fixed;bottom:calc(77px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;pointer-events:auto}#actions button{background:#283c36;border-color:#8f986b}#actions button.selected{background:#b58a42;color:#151b12}#info{position:fixed;top:calc(114px + env(safe-area-inset-top));left:10px;background:#182820e6;border:1px solid #b39a60;border-radius:8px;padding:7px 9px;font-size:12px;max-width:75vw;pointer-events:none}#reset{top:calc(77px + env(safe-area-inset-top))}#toast{bottom:calc(145px + env(safe-area-inset-bottom));max-width:90vw;white-space:normal;text-align:center}#zoomtools{position:fixed;right:9px;top:42%;display:flex;flex-direction:column;gap:8px;z-index:5}#zoomtools button{font-size:24px;width:45px;height:46px;padding:0;background:#1b2a25e8;border:1px solid #cfb77b;box-shadow:0 3px 12px #0007}#zoomtools button:active{background:#97773c}#rotateControls{position:fixed;right:10px;top:calc(155px + env(safe-area-inset-top));display:flex;gap:7px;z-index:5}#rotateControls button{font-size:23px;min-width:46px;min-height:46px;background:#243b33ed;border:1px solid #d4b976;box-shadow:0 3px 8px #0007}#angleLabel{position:fixed;right:12px;top:calc(205px + env(safe-area-inset-top));font-size:11px;color:#ffe3a5;background:#17241fe0;padding:4px 7px;border-radius:5px;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="zoomtools"><button id="zin" aria-label="Przybliż">+</button><button id="zout" aria-label="Oddal">−</button></div><div id="top"><div id="title">🏰 KRÓLESTWA PUSTYNI <small>0.8</small></div><div id="stats"></div></div><div id="hint">🏜️ Buduj królestwo • Przesuwaj mapę • Obracaj ⟲ ⟳</div><button id="reset">Nowa gra</button><div id="info"></div><div id="toast"></div><div id="actions"></div><div id="bar"></div><div id="rotateControls"><button id="rotLeft" aria-label="Obróć widok w lewo">⟲</button><button id="rotRight" aria-label="Obróć widok w prawo">⟳</button></div><div id="angleLabel">Widok 0°</div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stats=document.getElementById('stats'),bar=document.getElementById('bar'),actions=document.getElementById('actions'),info=document.getElementById('info'),toast=document.getElementById('toast');
const N=30,tw=64,th=32,KEY='krolestwa_v04';let viewTurn=0;
const types={keep:{label:'🏰 Zamek',cost:{},color:'#b9b5a6',hp:500},house:{label:'🏠 Dom',cost:{wood:15},color:'#bd8356',hp:90},lumber:{label:'🪓 Drwal',cost:{wood:10},color:'#7d5336',hp:90},quarry:{label:'⛏️ Kamieniołom',cost:{wood:20},color:'#8a9293',hp:100},farm:{label:'🌾 Farma',cost:{wood:12},color:'#bca454',hp:80},wall:{label:'🧱 Mur',cost:{stone:8},color:'#aaa9a1',hp:180},barracks:{label:'⚔️ Koszary',cost:{wood:35,stone:15},color:'#9b765d',hp:170},tower:{label:'🏹 Wieża',cost:{wood:15,stone:25},color:'#a8a89d',hp:150},gate:{label:'🚪 Brama',cost:{wood:12,stone:18},color:'#a9a394',hp:210}};
let resources={wood:130,stone:80,food:90,gold:130},buildings=[],units=[],enemyUnits=[],enemy={x:24,y:24,hp:380,max:380},selected='house',mode='build',chosen=[],cam={x:innerWidth/2,y:-150,zoom:.85},touches=new Map(),lastPinch=0,dragged=false,startPoint=null,gameTime=0,wave=0,won=false,lost=false,uid=1,last=performance.now(),tickAccum=0,saveAccum=0;
let enemyBuildings=[],aiTimer=0,aiSpawn=0,projectiles=[],villagers=[],dust=[],decorTime=0;let seed=19245;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const trees=[],rocks=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++){if(rand()<.13)trees.push({x,y});else if(rand()<.04)rocks.push({x,y})}
function fresh(){enemyBuildings=[{x:22,y:24,type:'barracks',hp:170},{x:24,y:22,type:'tower',hp:150},{x:26,y:24,type:'wall',hp:180}];aiTimer=0;aiSpawn=0;projectiles=[];villagers=[];dust=[];resources={wood:130,stone:80,food:90,gold:130};buildings=[{x:7,y:7,type:'keep',hp:500}];units=[];enemyUnits=[];enemy={x:24,y:24,hp:380,max:380};uid=1;gameTime=0;wave=0;won=false;lost=false;chosen=[];mode='build';selected='house'}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.buildings)){resources=s.resources;buildings=s.buildings;units=s.units||[];enemyUnits=s.enemyUnits||[];enemy=s.enemy||enemy;gameTime=s.gameTime||0;wave=s.wave||0;uid=s.uid||100;won=!!s.won;lost=!!s.lost;villagers=s.villagers||[];enemyBuildings=s.enemyBuildings||[];aiTimer=s.aiTimer||0;aiSpawn=s.aiSpawn||0;return}}catch(e){}try{let s=JSON.parse(localStorage.getItem('krolestwa_v03'));if(s&&Array.isArray(s.buildings)){fresh();resources={...resources,...s.resources};buildings=s.buildings;units=s.units||[];enemyUnits=s.enemyUnits||[];enemy=s.enemy||enemy;gameTime=s.gameTime||0;wave=s.wave||0;uid=s.uid||100;won=!!s.won;lost=!!s.lost;villagers=s.villagers||[];notify('Przeniesiono królestwo z 0.3!');return}}catch(e){}try{let s=JSON.parse(localStorage.getItem('krolestwa_v02'));if(s&&Array.isArray(s.buildings)){fresh();resources={...resources,...s.resources};buildings=s.buildings;units=s.units||[];enemyUnits=s.enemyUnits||[];enemy=s.enemy||enemy;gameTime=s.gameTime||0;wave=s.wave||0;uid=s.uid||100;won=!!s.won;lost=!!s.lost;notify('Przeniesiono królestwo z 0.2!');return}}catch(e){}try{let s=JSON.parse(localStorage.getItem('krolestwa_v01'));if(s&&Array.isArray(s.buildings)){fresh();resources={...resources,...s.resources};buildings=s.buildings.map(b=>({...b,hp:types[b.type]?.hp||90}));notify('Przeniesiono osadę z wersji 0.1!');return}}catch(e){}fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({resources,buildings,units,enemyUnits,enemy,gameTime,wave,uid,won,lost,villagers,enemyBuildings,aiTimer,aiSpawn}))}catch(e){}}
function notify(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(notify.t);notify.t=setTimeout(()=>toast.style.opacity=0,2200)}
function button(label,action,parent=actions){let b=document.createElement('button');b.textContent=label;b.onclick=action;parent.appendChild(b);return b}
for(let [k,t] of Object.entries(types)){if(k==='keep')continue;let b=button(t.label+' '+Object.entries(t.cost).map(([r,v])=>(r==='wood'?'🪵':'🪨')+v).join(' '),()=>{mode='build';selected=k;refresh()},bar);b.dataset.type=k}
let moveBtn=button('👆 Wybierz / ruch',()=>{mode='command';refresh()}),swordBtn=button('🗡️ Włócznik 20🪙 8🌾',()=>recruit('spear')),archerBtn=button('🏹 Łucznik 30🪙 10🌾',()=>recruit('archer')),swordmanBtn=button('🛡️ Miecznik 45🪙 14🌾',()=>recruit('sword')),ramBtn=button('🪵 Taran 65🪙 35🪵',()=>recruit('ram')),allBtn=button('⚔️ Cała armia',()=>{chosen=units.map(u=>u.id);mode='command';notify('Zaznaczono całą armię. Dotknij celu.');refresh()}),pauseBtn=button('⏸️ Pauza',()=>{paused=!paused;pauseBtn.textContent=paused?'▶️ Graj':'⏸️ Pauza'});let paused=false;let speed=1;button('⏩ x1 / x2',()=>{speed=speed===1?2:1;speedBtn.textContent='⏩ x'+speed},actions);let speedBtn=actions.lastChild;
function refresh(){stats.textContent=`🪵${Math.floor(resources.wood)} 🪨${Math.floor(resources.stone)} 🌾${Math.floor(resources.food)} 🪙${Math.floor(resources.gold)}`;for(let b of bar.children)b.classList.toggle('selected',mode==='build'&&b.dataset.type===selected);moveBtn.classList.toggle('selected',mode==='command');info.textContent=`👥 ${units.length} wojska • 🏴 Wróg ${Math.ceil(Math.max(0,enemy.hp))} HP • 👷 ${villagers.length} robotników • 🏴 ${enemyBuildings.length} budynków wroga • 🌊 Fala ${wave} • ${won?'🏆 ZWYCIĘSTWO':lost?'💀 PORAŻKA':mode==='build'?'Budowa: '+types[selected].label:chosen.length?'Rozkaz dla '+chosen.length+' jednostek':'Dotknij żołnierza, by zaznaczyć'}`}
function spend(cost){if(Object.entries(cost).some(([r,n])=>resources[r]<n)){notify('Za mało surowców!');return false}for(let [r,n] of Object.entries(cost))resources[r]-=n;return true}
function recruit(kind){if(lost||won)return notify('Rozpocznij nową grę');let b=buildings.find(b=>b.type==='barracks');if(!b)return notify('Najpierw zbuduj koszary!');let costs={spear:{gold:20,food:8},archer:{gold:30,food:10},sword:{gold:45,food:14},ram:{gold:65,wood:35}};if(!spend(costs[kind]))return;let health={spear:80,archer:55,sword:125,ram:240}[kind];units.push({id:uid++,kind,x:b.x+.5,y:b.y+.5,hp:health,max:health,tx:b.x+1.5,ty:b.y+.5,cool:0});save();refresh();notify('Zrekrutowano '+({spear:'włócznika',archer:'łucznika',sword:'miecznika',ram:'taran'}[kind]))}
function rotateGrid(x,y){let c=N/2,dx=x-c,dy=y-c;switch(viewTurn){case 1:return{x:c-dy,y:c+dx};case 2:return{x:c-dx,y:c-dy};case 3:return{x:c+dy,y:c-dx};default:return{x,y}}}
function unrotateGrid(x,y){let c=N/2,dx=x-c,dy=y-c;switch(viewTurn){case 1:return{x:c+dy,y:c-dx};case 2:return{x:c-dx,y:c-dy};case 3:return{x:c-dy,y:c+dx};default:return{x,y}}}
function iso(x,y){let r=rotateGrid(x,y);return{x:cam.x+(r.x-r.y)*tw*.5*cam.zoom,y:cam.y+(r.x+r.y)*th*.5*cam.zoom}}
function inverse(x,y){let a=(x-cam.x)/(tw*.5*cam.zoom),b=(y-cam.y)/(th*.5*cam.zoom);let r=unrotateGrid((a+b)/2,(b-a)/2);return{x:Math.floor(r.x),y:Math.floor(r.y)}}
function depth(o){let r=rotateGrid(o.x,o.y);return r.x+r.y}
function turnView(dir){viewTurn=(viewTurn+dir+4)%4;document.getElementById('angleLabel').textContent='Widok '+viewTurn*90+'°';notify('🔄 Obrócono kamerę o '+viewTurn*90+'°')}

function poly(p,fill,stroke){ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function diamond(x,y,color){let p=iso(x+.5,y+.5),w=tw*cam.zoom/2,h=th*cam.zoom/2;poly([{x:p.x,y:p.y-h},{x:p.x+w,y:p.y},{x:p.x,y:p.y+h},{x:p.x-w,y:p.y}],color,'#5b583c44')}
function prism(cx,cy,w,d,h,front,right,top){let z=cam.zoom, x=cx,y=cy,hw=w*z,hd=d*z,hh=h*z;poly([{x:x-hw,y:y-hh},{x:x,y:y+hd-hh},{x:x,y:y+hd},{x:x-hw,y:y}],front,'#423b32');poly([{x:x,y:y+hd-hh},{x:x+hw,y:y-hh},{x:x+hw,y:y},{x:x,y:y+hd}],right,'#423b32');poly([{x:x-hw,y:y-hh},{x:x,y:y-hd-hh},{x:x+hw,y:y-hh},{x:x,y:y+hd-hh}],top,'#d5c39b')}
function structure(b){let p=iso(b.x+.5,b.y+.5),z=cam.zoom,t=b.type,stone=['keep','wall','tower','gate'].includes(t),enemySide=enemyBuildings.some(e=>e.x===b.x&&e.y===b.y)||b===enemy;ctx.fillStyle='#29251a65';ctx.beginPath();ctx.ellipse(p.x+12*z,p.y+10*z,32*z,12*z,-.15,0,7);ctx.fill();if(t==='farm'){poly([{x:p.x,y:p.y-10*z},{x:p.x+24*z,y:p.y},{x:p.x,y:p.y+10*z},{x:p.x-24*z,y:p.y}],'#9b813e','#756232');for(let i=-3;i<=3;i++){let xx=p.x+i*6*z;ctx.strokeStyle=i%2?'#d9bc60':'#e8d17c';ctx.lineWidth=2*z;ctx.beginPath();ctx.moveTo(xx,p.y-6*z);ctx.lineTo(xx,p.y+7*z);ctx.stroke()}ctx.fillStyle='#648044';for(let i=0;i<5;i++)ctx.fillRect(p.x+(i-2)*7*z,p.y+(i%2)*3*z,2*z,4*z);return}
if(t==='wall'){prism(p.x,p.y,19,9,21,'#9b9689','#77766d','#d1c9b5');for(let i=-2;i<=2;i++){let x=p.x+i*7*z;ctx.fillStyle='#cfc7b4';ctx.fillRect(x-2*z,p.y-26*z,5*z,7*z)}ctx.strokeStyle='#716d63';ctx.lineWidth=z;ctx.beginPath();ctx.moveTo(p.x-16*z,p.y-10*z);ctx.lineTo(p.x-3*z,p.y-4*z);ctx.moveTo(p.x+2*z,p.y-7*z);ctx.lineTo(p.x+15*z,p.y-13*z);ctx.stroke()}
else if(t==='tower'||t==='keep'||t==='gate'){prism(p.x,p.y,18,10,t==='keep'?43:31,'#b6ad9b','#8c897f','#d8d0bc');if(t==='keep'){prism(p.x-11*z,p.y-15*z,8,5,48,'#a9a395','#858077','#d9d0bb');prism(p.x+12*z,p.y-16*z,8,5,48,'#aaa596','#827f76','#d9d0bb')}for(let i=-2;i<=2;i++){let xx=p.x+i*7*z;ctx.fillStyle='#d7cfbb';ctx.fillRect(xx-2*z,p.y-(t==='keep'?49:37)*z,5*z,7*z)}ctx.fillStyle='#3d342d';ctx.fillRect(p.x-5*z,p.y-14*z,10*z,14*z);ctx.fillStyle='#c6a668';ctx.fillRect(p.x-4*z,p.y-13*z,8*z,2*z);ctx.fillStyle=enemySide?'#b84035':'#d6b45d';ctx.fillRect(p.x+13*z,p.y-65*z,2*z,22*z);poly([{x:p.x+15*z,y:p.y-65*z},{x:p.x+29*z,y:p.y-60*z},{x:p.x+15*z,y:p.y-54*z}],enemySide?'#b84035':'#d6b45d')}
else{let base=t==='house'?'#b5a07b':t==='barracks'?'#a49b86':t==='lumber'?'#a77d52':'#9e9d94';prism(p.x,p.y,18,10,22,base,'#796c58','#b8a27b');let roof=t==='house'?'#a74d35':t==='barracks'?'#575c62':t==='lumber'?'#855335':'#77716a';poly([{x:p.x-21*z,y:p.y-22*z},{x:p.x,y:p.y-43*z},{x:p.x+21*z,y:p.y-22*z},{x:p.x,y:p.y-12*z}],roof,'#463b35');poly([{x:p.x,y:p.y-43*z},{x:p.x+21*z,y:p.y-22*z},{x:p.x+15*z,y:p.y-17*z},{x:p.x,y:p.y-35*z}],t==='house'?'#7e382d':'#4f4d46');ctx.fillStyle='#3d342b';ctx.fillRect(p.x-5*z,p.y-13*z,9*z,13*z);ctx.fillStyle='#d6b56a';ctx.fillRect(p.x+9*z,p.y-17*z,5*z,5*z);if(t==='lumber'){ctx.strokeStyle='#68452d';ctx.lineWidth=4*z;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(p.x-22*z,p.y+(i*3)*z);ctx.lineTo(p.x-8*z,p.y+(i*3-5)*z);ctx.stroke()}}if(t==='quarry'){ctx.fillStyle='#c2c0b5';for(let i=0;i<3;i++)poly([{x:p.x+(i*8-17)*z,y:p.y+4*z},{x:p.x+(i*8-14)*z,y:p.y-4*z},{x:p.x+(i*8-7)*z,y:p.y+3*z}],'#c0bcb0')}}
// Fine architectural details: sandstone joints, windows, beams and roof texture.
if(['keep','tower','gate','wall'].includes(t)){
 ctx.save();ctx.strokeStyle='#5b584d99';ctx.lineWidth=.85*z;
 let top=t==='keep'?43:t==='wall'?21:31;
 for(let row=0;row<Math.floor(top/6);row++){
   let yy=p.y-(row*6+5)*z,shift=(row%2)*5;
   ctx.beginPath();ctx.moveTo(p.x-14*z,yy);ctx.lineTo(p.x+14*z,yy+2*z);ctx.stroke();
   for(let k=-2;k<=2;k++){let xx=p.x+(k*10+shift)*z;ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx,yy-5*z);ctx.stroke()}
 }
 ctx.fillStyle='#252b2b';ctx.fillRect(p.x-3*z,p.y-(top-9)*z,6*z,9*z);
 ctx.fillStyle='#7c7b71';ctx.fillRect(p.x-2*z,p.y-(top-9)*z,1.5*z,8*z);
 ctx.restore();
}else if(t!=='farm'){
 ctx.save();ctx.strokeStyle='#332b2577';ctx.lineWidth=1.1*z;
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(p.x+i*7*z,p.y-(36-Math.abs(i)*4)*z);ctx.lineTo(p.x+(i+1)*7*z,p.y-(33-Math.abs(i)*4)*z);ctx.stroke()}
 ctx.strokeStyle='#e5c88d99';ctx.beginPath();ctx.moveTo(p.x-14*z,p.y-13*z);ctx.lineTo(p.x-14*z,p.y-3*z);ctx.moveTo(p.x+14*z,p.y-13*z);ctx.lineTo(p.x+14*z,p.y-3*z);ctx.stroke();ctx.restore();
